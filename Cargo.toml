[workspace]
members = ["crates/native-vault", "crates/contracts", "crates/app-core", "apps/desktop/src-tauri", "crates/cad-tool-host", "crates/model-provider"]
default-members = ["crates/contracts", "crates/app-core", "crates/cad-tool-host", "crates/model-provider"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
