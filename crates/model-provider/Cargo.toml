[package]
name = "cad-model-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-support = []

[dependencies]
oauth2 = { version = "=5.0.0", default-features = false }
jsonwebtoken = "=9.3.1"
url = "2"

async-trait = "=0.1.89"
futures-util = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
